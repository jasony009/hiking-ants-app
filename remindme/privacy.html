    <h1>隐私政策</h1>
    <p>生效日期：2026年09月</p>
    <p>RemindMe为免费应用，<strong>不会收集、存储、上传任何用户个人信息</strong>。</p>
    <p>本App不集成广告SDK、数据分析SDK，不会主动访问定位、相册、通讯录、麦克风等隐私权限。所有功能均在用户本地设备运行，不会向任何服务器上传用户数据。</p>
    <p>我们不会共享、出售任何用户信息，因为本应用不采集任何用户数据。</p>
    <p>您可以正常卸载应用，卸载后本地相关数据将从您设备移除。</p>
    <p>我们保留更新本隐私政策的权利，修改后的政策将在页面更新后生效。</p>
